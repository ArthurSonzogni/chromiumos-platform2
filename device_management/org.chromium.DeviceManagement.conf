<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="device_management">
    <allow own="org.chromium.DeviceManagement" />
    <allow receive_sender="org.chromium.DeviceManagement" />
    <allow send_destination="org.chromium.DeviceManagement" />
    <allow send_interface="org.chromium.DeviceManagement" />
  </policy>
  <!-- For session_manager -->
  <policy user="session_manager">
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="GetFirmwareManagementParameters" />
  </policy>
  <!-- For chromium: grant only the methods invoked by
       ash::InstallAttributesClient.
       SetFirmwareManagementParameters and RemoveFirmwareManagementParameters
       are invoked by Chrome (running as chronos) during OOBE in
       EnrollmentHandler and AutoEnrollmentController, and are gated on
       InstallAttributes::Status::kFirstInstall
       in DeviceManagementService. -->
  <policy user="chronos">
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="InstallAttributesGet" />
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="InstallAttributesSet" />
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="InstallAttributesFinalize" />
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="InstallAttributesGetStatus" />
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="GetFirmwareManagementParameters" />
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="RemoveFirmwareManagementParameters" />
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="SetFirmwareManagementParameters" />
  </policy>
  <!-- For debugging -->
  <policy user="root">
    <allow own="org.chromium.DeviceManagement" />
    <allow receive_sender="org.chromium.DeviceManagement" />
    <allow send_destination="org.chromium.DeviceManagement" />
    <allow send_interface="org.chromium.DeviceManagement" />
  </policy>
  <policy user="rmad">
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="GetFirmwareManagementParameters"/>
  </policy>
  <policy user="debugd">
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="InstallAttributesGetStatus"/>
    <allow send_destination="org.chromium.DeviceManagement"
           send_interface="org.chromium.DeviceManagement"
           send_member="GetFirmwareManagementParameters"/>
  </policy>
</busconfig>
